<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>ALTSchool Sign In Page</title>
    </head>

<header>
    <nav aria-label="main navigation">
        <span><a href="index.html">index.html</a></span>
        <span aria-current="page">form.html</span>
    </nav>
</header>

    <body>
        <h1>Alt__School</h1>

        <nav><a href="signup.html">Sign up</a> 
        <span aria-current="page">Sign In</span></nav>

    <p><h1>Sign In</h1></p>
    <p>Enter your email address and password to securelylog in to AltSchool Student Portal</p>
        <form>
            <p><label><strong>Email</strong></label><br>
            <input type="email" id="email-address" name="email" placeholder="john.doe@gmail.com" required aria-invalid="true" aria-describedby="email-hint email-error" pattern="^.+@.+\.(com|org)$" />
            </p>

        <p><label><strong>Password</strong></label><br>
            <input type="text" id="password" name="password" placeholder="********" aria-describedby="password-hint password-error" minlength="8"/>
            </p>
            
            <button type="submit">Proceed to Dashboard</button>
        </form>

        <p>Forgot your Password? <a href="reset.html">Reset Now</a></p>
        <p>OR</p>
        <p><button type="buttons">Login with Google</button></p>
   
    <footer><p> Address: Lagos, Nigeria</p>

    </body>
</html>
